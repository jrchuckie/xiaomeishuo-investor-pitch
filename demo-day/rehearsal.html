const MARKDOWN="# 小美说｜Demo Day 演讲稿\n\n2026年10月15日 · 15页主讲＋附录总览＋4页问答速查＋完整39页Investor v8\n\n**主讲目标4分45秒，留15秒余量。** 以下正文可以直接口播；“讲述提示”和“备查口径”不念。分段处可以换气。时间为排练参考，尚需按本人语速实测。\n\n## 先记住这条主线\n\n我是长期用户 → 我遇到的困扰，很多人也有 → 小美说如何解决 → 为什么不同 → 已有验证 → 如何获客和收费 → 下一步与300万元投资。\n\n## 逐页讲稿\n\n### P01｜我是查克，也是一个长期医美用户\n\n**00:00—00:18 · 参考18秒**\n\n> 讲述提示：像介绍自己一样自然；在“长期医美用户”稍停，再翻页。\n\n大家好，我是查克，之前做消费品牌策略咨询，现在在小红书。\n\n我从十八岁开始接触 Botox，自己和许多家人朋友都是长期医美用户。\n\n**脱稿关键词：** 消费品牌策略咨询 / 小红书 / 长期医美用户\n\n### P02｜想变美，却不敢轻易做决定\n\n**00:18—00:44 · 参考26秒**\n\n> 讲述提示：“我要是也能变成这样就好了”用自问的语气；四个困扰之间留一点停顿。\n\n我常在小红书看到好看的人，想：我要是也能变成这样就好了。但不知道该怎么变。\n\n去医院，又担心被推荐不需要的项目，或者医生喜欢的样子跟我不一样。\n\n医美花钱，也要承担恢复成本。我最想知道的效果，却很难从网上那些像 AI 换头的案例里判断。\n\n**脱稿关键词：** 不知道怎么变 / 担心被推销／审美不同 / 想提前理解效果\n\n### P03｜后来我发现，很多人也有同样的困扰\n\n**00:44—01:00 · 参考16秒**\n\n> 讲述提示：从“我”转向“很多人”；不要逐个读图表数字。\n\n后来，三十六份体验后问卷也印证了这一点：很多人同样怕项目不适合、被推销，或案例不真实。\n\n小美说要解决的，是这些共同的困扰。\n\n**脱稿关键词：** 体验后问卷 / 共同痛点 / 确认问题值得解决\n\n### P04｜对自己的审美有主见，渴望不断遇见更好的自己\n\n**01:00—01:10 · 参考10秒**\n\n> 讲述提示：像描述身边熟悉的人一样讲，不念虚构人物的姓名与履历。\n\n我们服务对自己的审美有主见，渴望不断遇见更好的自己，希望更可控、从容、安心地变美的人。\n\n**脱稿关键词：** 审美有主见 / 不断遇见更好的自己 / 可控、从容、安心\n\n### P05｜你眼中的美，看得见，说得清\n\n**01:10—01:30 · 参考20秒**\n\n> 讲述提示：先指参考照片，再移到画像；重读“可以表达、可以讨论”，让观众听懂画像的价值。\n\n具体怎么做？先选出喜欢的参考照片。\n\n小美说帮你看懂喜欢的轮廓、五官与整体风格，形成审美画像。\n\n把“我喜欢这种感觉”，变成可以表达、可以讨论的方向。\n\n**脱稿关键词：** 喜欢的参考照片 / 轮廓、五官与整体风格 / 可以表达和讨论的方向\n\n### P06｜从你的审美，到可讨论的方案\n\n**01:30—01:52 · 参考22秒**\n\n> 讲述提示：从本人特点讲到候选项目；重读“选择和调整”，不逐项念项目、用量或价格。\n\n再结合本人的照片，明确想保留和改变的特点，整理候选项目、参考用量与预算。\n\n每一步都由用户来选择和调整：把笼统的“想变美”，变成可以带去面诊讨论的方案。\n\n**脱稿关键词：** 保留与改变的特点 / 候选项目与参考预算 / 带去面诊讨论\n\n### P07｜让心里的想法，先有画面\n\n**01:52—02:12 · 参考20秒**\n\n> 讲述提示：指明左侧原照、右侧AI模拟，稍停让观众看图；重读“视觉方向”，再说明需医生确认。\n\n接着，选择想预览的项目，让心里的想法先有画面。\n\n左边是原照，右边是App生成的AI模拟，可以比较，再调整。\n\n它呈现的是可讨论的视觉方向，实际能否实现仍需医生确认。\n\n**脱稿关键词：** 让想法先有画面 / 原照与AI模拟 / 视觉方向需医生确认\n\n### P08｜带着自己的想法，从容面诊\n\n**02:12—02:30 · 参考18秒**\n\n> 讲述提示：指向面诊沟通卡；重读“自己的想法和问题”，用医生确认适合与实施收束产品体验。\n\n最后，把原照、AI模拟和所选项目整理成面诊沟通卡。\n\n面诊之前，就有自己的想法和问题，让医生更清楚地理解你的审美与期待，再由医生确认是否适合、如何实施。\n\n**脱稿关键词：** 原照＋模拟＋所选项目 / 面诊前有想法和问题 / 医生确认适合与实施\n\n### P09｜懂你的审美，也站在你这一边\n\n**02:30—02:50 · 参考20秒**\n\n> 讲述提示：从图中抬头看观众；强调“美没有标准答案”和“也可以选择暂不改变”。\n\n小美说的切入点，是消费者立场和个人审美。\n\n美没有标准答案，我们先理解你的审美，再讨论如何实现。\n\n你的反馈改变方案，每一步都由你来决定，也可以选择暂不改变。\n\n**脱稿关键词：** 消费者立场 × 个人审美 / 先理解审美，再讨论实现 / 每一步由你决定\n\n### P10｜从真实体验，到价值认可与付费意向\n\n**02:50—03:26 · 参考36秒**\n\n> 讲述提示：用“第一、第二、第三”带节奏；数字之间稍停，引用反馈后不再加例子。\n\n验证给了我们三个信号。\n\n第一，有真实体验：五十多个外部安装账号、五百多次使用会话，以及陪测、问卷和行业访谈。\n\n第二，用户觉得有用：三十六位受访者中，百分之八十六认为有助于医美决策，有人说“效果对比很直观，提的四项方案很有用”。\n\n第三，一半愿意考虑为 AI 付费；如果增加医生二次面诊，接近七成愿意考虑付费。下一步，要把意向验证成真实成交。\n\n**脱稿关键词：** 真实体验 / 86% 认可价值 / 50%／69% 付费意向\n\n### P11｜先跑通个人付费与连锁机构试点\n\n**03:26—04:05 · 参考39秒**\n\n> 讲述提示：先说当前官网免费预览，再指两条获客路径和拟议试点价格；49／20与25／10.5两组数字分开讲。\n\n当前官网免费预览，下一步通过B端和C端同时获客。C端靠小红书内容、投放和转介绍；B端从集团合作，到门店试点，再到报告续采。\n\n拟测试个人四十九元一次、机构二十元一份。\n\n按当前预算，扣除退款、税与直接成本后，单次毛利约二十五元和十点五元，尚未扣获客、团队与研发。\n\n前九十天用成交、退款、交付贡献与门店用量复盘，再决定扩大投入。\n\n**脱稿关键词：** 当前免费预览 / 两端获客，49元／20元拟测试 / 预算毛利＋90天复盘\n\n### P12｜与机构合作获取真实案例，持续迭代方案与模拟\n\n**04:05—04:18 · 参考13秒**\n\n> 讲述提示：重读“授权的真实前后案例”；这是下一步计划，不要讲成已有合作。\n\n下一步，与机构合作获取授权的真实前后案例，建立评测，迭代方案和模拟。\n\n再探索三维与可控模拟，逐步迭代任务模型。\n\n**脱稿关键词：** 授权真实案例 / 评测与迭代 / 三维与可控模拟\n\n### P13｜团队架构\n\n**04:18—04:26 · 参考8秒**\n\n> 讲述提示：顺着组织图快速点过，不在这里展开人员预算。\n\n我负责统筹；计划由 BD 推进机构合作，营销负责个人增长，研发外包按里程碑交付。\n\n**脱稿关键词：** 我来统筹 / BD＋营销 / 外包研发\n\n### P14｜融资300万元，推进首年商业验证\n\n**04:26—04:37 · 参考11秒**\n\n> 讲述提示：清楚说出“三百万元”，再说三类用途；重心落在要验证的结果。\n\n本轮申请三百万元：团队与外包研发两百万，两端市场拓展八十七万，团队 AI 额度十三万。\n\n把用户认可，推进成持续的个人付费和机构采购。\n\n**脱稿关键词：** 申请300万元 / 200＋87＋13 / 验证持续付费与采购\n\n### P15｜让你的审美，决定你的美\n\n**04:37—04:45 · 参考8秒**\n\n> 讲述提示：看向观众说“你的审美，值得被认真理解”；品牌句放慢，留一拍再致谢，停留本页等提问。\n\n你的审美，值得被认真理解。\n\n小美说，让你的审美，决定你的美。\n\n谢谢。\n\n**脱稿关键词：** 审美值得被认真理解 / 让你的审美，决定你的美 / 致谢\n\n## 问答附录与完整资料\n\n以下不计入5分钟主讲。先回应问题，再按主题查找；v8为保留版本的完整参考资料。\n\n## 附录总览\n\n### P16｜附录目录｜按问题查阅完整资料\n\n> 先按评委的问题选主题，不需要从附录第一页顺讲。 在主题筛选或下方主题入口中选择；主讲讲完停在P15，附录不计入五分钟。\n\n先回应评委的问题；预算、经营情景、付费证据和下一步验证，可以先用四页问答速查。\n\n需要展开时，选择对应主题：用户与定位、产品流程、验证反馈、市场与商业化、技术团队与未来、财务测算。\n\n完整v8保留原页码与版本。历史产品截图、拟议价格和经营目标，分别按页面标注说明。\n\n备查：15页主  render();try{history.replaceState(null,'','#'+PAGES[n].key)}catch{}
}
function selectGroup(id){filter=id;const shown=visibleIndices();go(shown.includes(index)?index:shown[0])}
function step(delta){const shown=visibleIndices(),position=shown.indexOf(index);if(position+delta>=0&&position+delta<shown.length)go(shown[position+delta])}
function setMode(next){mode=next;$('spoken').hidden=mode!=='full';$('keywords').hidden=mode!=='key';$('keywords').style.display=mode==='key'?'flex':'none';$('full-mode').setAttribute('aria-pressed',String(mode==='full'));$('key-mode').setAttribute('aria-pressed',String(mode==='key'));$('notes-scroll').scrollTop=0}
function setFont(delta){fontSize=Math.min(34,Math.max(18,fontSize+delta));document.documentElement.style.setProperty('--script-size',fontSize+'px');$('smaller').disabled=fontSize===18;$('larger').disabled=fontSize===34}
function zoom(){const p=PAGES[index];$('large-image').src=p.image;$('lightbox-title').textContent=`P${p.page} · ${p.title}${p.source_page?' · v8原P'+p.source_page:''}`;$('lightbox').showModal()}
const all=document.createElement('option');all.value='all';all.textContent='全部主题';$('group-filter').append(all);
for(const group of GROUPS){const option=document.createElement('option');option.value=group.id;option.textContent=group.label+'（'+group.indices.length+'）';$('group-filter').append(option)}
$('group-filter').onchange=e=>selectGroup(e.target.value);$('page-select').onchange=e=>go(Number(e.target.value));$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('timer').onclick=toggleTimer;$('reset').onclick=()=>{accumulated=0;running=false;pageStarted=0;timerView();toast('计时已清零，当前页保留')};
$('full-mode').onclick=()=>setMode('full');$('key-mode').onclick=()=>setMode('key');$('smaller').onclick=()=>setFont(-1);$('larger').onclick=()=>setFont(1);
$('layout').onclick=()=>{const solo=document.body.classList.toggle('only-script');$('layout').textContent=solo?'左右对照':'只看讲稿';$('layout').setAttribute('aria-pressed',String(solo))};
$('zoom').onclick=zoom;$('slide-image').onclick=zoom;$('slide-image').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();zoom()}};$('close-lightbox').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};
$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([MARKDOWN],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='小美说-DemoDay-演讲稿.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if($('lightbox').open||e.altKey||e.ctrlKey||e.metaKey)return;const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target.isContentEditable)return;if(e.key===' '&&['BUTTON','SUMMARY'].includes(tag))return;if(['ArrowLeft','ArrowRight',' ','Home','End'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key===' ')toggleTimer();if(e.key==='Home')go(0);if(e.key==='End')go(MAIN_COUNT-1)});
function printSection(p){return `<section class="print-section ${p.group_id==='index'?'qa-start':''}"><div class="print-time">${p.seconds?time(p.start)+'—'+time(p.end)+' · 参考'+p.seconds+'秒':escape(p.group_label)+' · 不计入主讲'}</div><h2>P${String(p.page).padStart(2,'0')}｜${escape(p.title)}</h2>${p.source_page?'<p class="print-cue">'+escape(sourceLabel(p))+'</p>':''}<p class="print-cue">讲述提示（不念）：${escape(p.cue)}</p>${p.script.map(s=>'<p>'+escape(s)+'</p>').join('')}<p class="print-key">${isMain(p)?'脱稿关键词':'回答要点'}：${p.beats.map(escape).join(' / ')}</p></section>`}
$('print-pack').innerHTML='<div class="print-cover"><h1>小美说｜Demo Day 演讲稿</h1><p>2026.10.15 · 15页主讲，参考4分45秒，留15秒余量；附录按主题查阅。提示不念；实际用时请按本人语速实测。</p></div>'+PAGES.map(printSection).join('');
function readHash(){let key;try{key=decodeURIComponent(location.hash.slice(1))}catch{return -1}return PAGES.findIndex(p=>p.key===key)}
const initial=readHash();if(initial>=0)index=initial;
window.addEventListener('hashchange',()=>{const next=readHash();if(next>=0)go(next)});
setMode('full');render();setInterval(timerView,200);
</script>
</body></html>
