const PAGES=[{"page": 1, "key": "founder", "title": "我是查克，也是一个长期医美用户", "seconds": 18, "start": 0, "end": 18, "script": ["大家好，我是查克，之前做消费品牌策略咨询，现在在小红书。", "我从十八岁开始接触 Botox，自己和许多家人朋友都是长期医美用户。"], "beats": ["消费品牌策略咨询", "小红书", "长期医美用户"], "cue": "像介绍自己一样自然；在“长期医美用户”稍停，再翻页。", "reference": "个人经历按本人自述；照片是品牌概念视觉。", "focus": "消费品牌策略咨询 · 小红书 · 长期医美用户", "image": "assets/a1b92f15d309d200ebfd8d02921495d38853868920a0347400219f59b64ca5da.jpg"}, {"page": 2, "key": "personal-pains", "title": "想变美，却不敢轻易做决定", "seconds": 26, "start": 18, "end": 44, "script": ["我常在小红书看到好看的人，想：我要是也能变成这样就好了。但不知道该怎么变。", "去医院，又担心被推荐不需要的项目，或者医生喜欢的样子跟我不一样。", "医美花钱，也要承担恢复成本。我最想知道的效果，却很难从网上那些像 AI 换头的案例里判断。"], "beats": ["不知道怎么变", "担心被推销／审美不同", "想提前理解效果"], "cue": "“我要是也能变成这样就好了”用自问的语气；四个困扰之间留一点停顿。", "reference": "讲自己的担心，不把所有医生或机构概括成同一种行为。", "focus": "不知道怎么变 · 担心被推销／审美不同 · 想提前理解效果", "image": "assets/2f164eb986ea068efd8d6e5ec891df52b7763e165b747755cfcc1d9062027542.jpg"}, {"page": 3, "key": "shared-pains", "title": "后来我发现，很多人也有同样的困扰", "seconds": 16, "start": 44, "end": 60, "script": ["后来，三十六份体验后问卷也印证了这一点：很多人同样怕项目不适合、被推销，或案例不真实。", "小美说要解决的，是这些共同的困扰。"], "beats": ["体验后问卷", "共同痛点", "确认问题值得解决"], "cue": "从“我”转向“很多人”；不要逐个读图表数字。", "reference": "36份为2026年9月9—10日完整体验后问卷；早期便利样本，不能外推全国人群。", "focus": "体验后问卷 · 共同痛点 · 确认问题值得解决", "image": "assets/ce843d762c1ccfd4e65eb853114582dd07fe1196e57ac1eb1d41ba5144e18974.jpg"}, {"page": 4, "key": "who-for", "title": "对自己的审美有主见，渴望不断遇见更好的自己", "seconds": 10, "start": 60, "end": 70, "script": ["我们服务对自己的审美有主见，渴望不断遇见更好的自己，希望更可控、从容、安心地变美的人。"], "beats": ["审美有主见", "不断遇见更好的自己", "可控、从容、安心"], "cue": "像描述身边熟悉的人一样讲，不念虚构人物的姓名与履历。", "reference": "页面人物是虚构目标画像，不代表已验证的客群分布。", "focus": "审美有主见 · 不断遇见更好的自己 · 可控、从容、安心", "image": "assets/f952a839d877af33e1ca6e15d17d41ad0a6f7b265af9735ede14b31140b3d744.jpg"}, {"page": 5, "key": "taste", "title": "你眼中的美，看得见，说得清", "seconds": 20, "start": 70, "end": 90, "script": ["具体怎么做？先选出喜欢的参考照片。", "小美说帮你看懂喜欢的轮廓、五官与整体风格，形成审美画像。", "把“我喜欢这种感觉”，变成可以表达、可以讨论的方向。"], "beats": ["喜欢的参考照片", "轮廓、五官与整体风格", "可以表达和讨论的方向"], "cue": "先指参考照片，再移到画像；重读“可以表达、可以讨论”，让观众听懂画像的价值。", "reference": "页面为 Build 65 实际产品截图；官网的“看得见、说得清”用于描述审美表达，不代表客观颜值评分或临床准确性。", "focus": "喜欢的参考照片 · 轮廓、五官与整体风格 · 可以表达和讨论的方向", "image": "assets/f314c11d494abd9d00a2ef6b4c0d5b6db7f9b818dd697353a6b71aa99dfc280e.jpg"}, {"page": 6, "key": "personal-plan", "title": "从你的审美，到可讨论的方案", "seconds": 22, "start": 90, "end": 112, "script": ["再结合本人的照片，明确想保留和改变的特点，整理候选项目、参考用量与预算。", "每一步都由用户来选择和调整：把笼统的“想变美”，变成可以带去面诊讨论的方案。"], "beats": ["保留与改变的特点", "候选项目与参考预算", "带去面诊讨论"], "cue": "从本人特点讲到候选项目；重读“选择和调整”，不逐项念项目、用量或价格。", "reference": "候选项目、参考用量与预算用于面诊讨论，不是已确认适合用户的治疗建议；具体诊疗由医生评估。", "focus": "保留与改变的特点 · 候选项目与参考预算 · 带去面诊讨论", "image": "assets/0b93f70d2cc0f9543b1cc8e38827f470654a05223e5601a8874c97beb5118f9d.jpg"}, {"page": 7, "key": "simulation", "title": "让心里的想法，先有画面", "seconds": 20, "start": 112, "end": 132, "script": ["接着，选择想预览的项目，让心里的想法先有画面。", "左边是原照，右边是App生成的AI模拟，可以比较，再调整。", "它呈现的是可讨论的视觉方向，实际能否实现仍需医生确认。"], "beats": ["让想法先有画面", "原照与AI模拟", "视觉方向需医生确认"], "cue": "指明左侧原照、右侧AI模拟，稍停让观众看图；重读“视觉方向”，再说明需医生确认。", "reference": "本页是 Build 65 App 实际生成的 AI 方案模拟，呈现可讨论的视觉方向，不是真实术后照片或疗效预测；官网可视化区为单独制作的合成人像示例，不能混作本页证据。", "focus": "让想法先有画面 · 原照与AI模拟 · 视觉方向需医生确认", "image": "assets/c6b472d18a1b89ba10d23fd96d26cf435109b63e0ec64b95e4a8f4f40f57859b.jpg"}, {"page": 8, "key": "consultation", "title": "带着自己的想法，从容面诊", "seconds": 18, "start": 132, "end": 150, "script": ["最后，把原照、AI模拟和所选项目整理成面诊沟通卡。", "面诊之前，就有自己的想法和问题，让医生更清楚地理解你的审美与期待，再由医生确认是否适合、如何实施。"], "beats": ["原照＋模拟＋所选项目", "面诊前有想法和问题", "医生确认适合与实施"], "cue": "指向面诊沟通卡；重读“自己的想法和问题”，用医生确认适合与实施收束产品体验。", "reference": "面诊卡把原照、AI模拟与所选项目带入讨论；医生确认是否适合及如何实施，“问小美”不替代具体诊疗。", "focus": "原照＋模拟＋所选项目 · 面诊前有想法和问题 · 医生确认适合与实施", "image": "assets/d4e31dcdf28b483a355553b65678599b86b10d09adffd10b614c30b8e2f7e5b8.jpg"}, {"page": 9, "key": "competitive-map", "title": "懂你的审美，也站在你这一边", "seconds": 20, "start": 150, "end": 170, "script": ["小美说的切入点，是消费者立场和个人审美。", "美没有标准答案，我们先理解你的审美，再讨论如何实现。", "你的反馈改变方案，每一步都由你来决定，也可以选择暂不改变。"], "beats": ["消费者立场 × 个人审美", "先理解审美，再讨论实现", "每一步由你决定"], "cue": "从图中抬头看观众；强调“美没有标准答案”和“也可以选择暂不改变”。", "reference": "消费者立场和用户选择权是产品与合作原则，不宣称同类产品没有这些能力；机构合作或商业关系需要披露。", "focus": "消费者立场 × 个人审美 · 先理解审美，再讨论实现 · 每一步由你决定", "image": "assets/2fafa639ba05e43a7dd48c41135a7420e5245c6358dba94451f9484529fa12dc.jpg"}, {"page": 10, "key": "validation", "title": "从真实体验，到价值认可与付费意向", "seconds": 36, "start": 170, "end": 206, "script": ["验证给了我们三个信号。", "第一，有真实体验：五十多个外部安装账号、五百多次使用会话，以及陪测、问卷和行业访谈。", "第二，用户觉得有用：三十六位受访者中，百分之八十六认为有助于医美决策，有人说“效果对比很直观，提的四项方案很有用”。", "第三，一半愿意考虑为 AI 付费；如果增加医生二次面诊，接近七成愿意考虑付费。下一步，要把意向验证成真实成交。"], "beats": ["真实体验", "86% 认可价值", "50%／69% 付费意向"], "cue": "用“第一、第二、第三”带节奏；数字之间稍停，引用反馈后不再加例子。", "reference": "9月11日核对的50+安装账号、500+使用会话；各验证样本可能重叠。31/36认可决策价值，18/36愿考虑AI付费，25/36在增加真人医生二次面诊的条件下愿考虑付费。这不是实际成交。引语来自R20、问卷Q6。", "focus": "真实体验 · 86% 认可价值 · 50%／69% 付费意向", "image": "assets/ee39bba956d234489a3379111e309048dc7c1fddfd3cf9e62f825f3e8314d643.jpg"}, {"page": 11, "key": "launch", "title": "先跑通个人付费与连锁机构试点", "seconds": 39, "start": 206, "end": 245, "script": ["当前官网免费预览，下一步通过B端和C端同时获客。C端靠小红书内容、投放和转介绍；B端从集团合作，到门店试点，再到报告续采。", "拟测试个人四十九元一次、机构二十元一份。", "按当前预算，扣除退款、税与直接成本后，单次毛利约二十五元和十点五元，尚未扣获客、团队与研发。", "前九十天用成交、退款、交付贡献与门店用量复盘，再决定扩大投入。"], "beats": ["当前免费预览", "两端获客，49元／20元拟测试", "预算毛利＋90天复盘"], "cue": "先说当前官网免费预览，再指两条获客路径和拟议试点价格；49／20与25／10.5两组数字分开讲。", "reference": "2026年10月14日官网为免费预览，正式收费尚未开放；49元和20元均为拟议试点价格。C端净收入约43.9−直接成本19.0＝毛利24.9；B端18.5−8.0＝10.5，均为预算。B端500份起购、1万元预付；未消耗预付款不是已确认营收。毛利未扣获客、团队、研发；首年3.1万人与3集团／30门店是目标。", "focus": "当前免费预览 · 两端获客，49元／20元拟测试 · 预算毛利＋90天复盘", "image": "assets/16e78d38fc6794ebb91688d8d06ad3a449622c1e1c0089486ecc73cf8d02fa50.jpg"}, {"page": 12, "key": "technology", "title": "与机构合作获取真实案例，持续迭代方案与模拟", "seconds": 13, "start": 245, "end": 258, "script": ["下一步，与机构合作获取授权的真实前后案例，建立评测，迭代方案和模拟。", "再探索三维与可控模拟，逐步迭代任务模型。"], "beats": ["授权真实案例", "评测与迭代", "三维与可控模拟"], "cue": "重读“授权的真实前后案例”；这是下一步计划，不要讲成已有合作。", "reference": "真实案例合作、三维、手动微调和自有任务模型均为计划；案例用于训练、评测、展示需分别取得对应授权。", "focus": "授权真实案例 · 评测与迭代 ·  "先验证再扩量"], "cue": "先说这是模型情景，再回答评委问到的数字；不把预测讲成确定结果。", "script": ["这页是经营目标情景，依赖个人付费增长、机构门店使用和复购等假设，尚未被真实经营验证。", "首年净收入预计约二百六十九万元；模型里的第二年税前转正也依赖这些目标达成。我们先用前九十天验证实际成交、交付成本和持续使用，再调整扩量节奏。"], "reference": "收入与利润均为预测；月度资金峰值尚未建模。具体年度指标以页面为准。", "title": "附录｜三年经营目标情景", "key": "financial-forecast", "seconds": 0, "start": 285, "end": 285, "image": "assets/4d91ec3117dfe159fc498e520ba4d9c17833bc953c118efbaf8487b3638b2d5f.jpg"}, {"page": 18, "focus": "被问“付费意向是否等于有人愿意付49元”时翻到这里。", "beats": ["18/36为意向", "49元待测", "真实支付与退款验证"], "cue": "直接回答“还没有验证49元”；再讲已有证据与下一步。", "script": ["还没有验证四十九元的真实成交。三十六位受访者中，十八人愿意考虑为AI服务付费；愿意且填了金额的十四人里，最高愿付金额中位数约十九元，只有三人达到四十九元。", "所以四十九元是待测试的报价。我们会用真实支付、交付后的退款和再次购买来验证。"], "reference": "愿付金额中位数18.84元；3/14不是3/36的成交率。加医生面诊的25/36也是条件下的付费意向。", "title": "附录｜验证事实与价格假设", "key": "evidence-boundaries", "seconds": 0, "start": 285, "end": 285, "image": "assets/aad472920873b72bf476106da458c4fe4c311014d1aad6ecaa1c441dbf606b5d.jpg"}, {"page": 19, "focus": "被问“下一阶段如何证明值得继续投”时翻到这里。", "beats": ["成交与退款", "交付质量和成本", "机构持续使用"], "cue": "回答用什么证据做决定；不临时承诺未经对齐的考核阈值。", "script": ["我们要验证三件事：个人是否真的付款，机构是否持续使用，以及每单能否可靠交付、留下正贡献。", "前九十天一起看真实成交、退款、交付成本和门店使用，再决定扩大、收窄，还是调整投入。功能完成本身不等于商业验证完成。"], "reference": "这是下一阶段验证安排，不是已批准的拨款或投资考核制度。", "title": "附录｜下一步用什么结果复盘", "key": "next-validation", "seconds": 0, "start": 285, "end": 285, "image": "assets/9fc6062d49296f4b4136926b488b8e797a23c5e8e7b0eab98a605bb7e985984d.jpg"}];
const MARKDOWN="# 小美说｜Demo Day 演讲稿\n\n2026年10月14日 · 对应当前路演的15页主讲＋4页问答附录\n\n**主讲目标4分45秒，留15秒余量。** 以下正文可以直接口播；“讲述提示”和“备查口径”不念。分段处可以换气。时间为排练参考，尚需按本人语速实测。\n\n## 先记住这条主线\n\n我是长期用户 → 我遇到的困扰，很多人也有 → 小美说如何解决 → 为什么不同 → 已有验证 → 如何获客和收费 → 下一步与300万元投资。\n\n## 逐页讲稿\n\n### P01｜我是查克，也是一个长期医美用户\n\n**00:00—00:18 · 参考18秒**\n\n> 讲述提示：像介绍自己一样自然；在“长期医美用户”稍停，再翻页。\n\n大家好，我是查克，之前做消费品牌策略咨询，现在在小红书。\n\n我从十八岁开始接触 Botox，自己和许多家人朋友都是长期医美用户。\n\n**脱稿关键词：** 消费品牌策略咨询 / 小红书 / 长期医美用户\n\n### P02｜想变美，却不敢轻易做决定\n\n**00:18—00:44 · 参考26秒**\n\n> 讲述提示：“我要是也能变成这样就好了”用自问的语气；四个困扰之间留一点停顿。\n\n我常在小红书看到好看的人，想：我要是也能变成这样就好了。但不知道该怎么变。\n\n去医院，又担心被推荐不需要的项目，或者医生喜欢的样子跟我不一样。\n\n医美花钱，也要承担恢复成本。我最想知道的效果，却很难从网上那些像 AI 换头的案例里判断。\n\n**脱稿关键词：** 不知道怎么变 / 担心被推销／审美不同 / 想提前理解效果\n\n### P03｜后来我发现，很多人也有同样的困扰\n\n**00:44—01:00 · 参考16秒**\n\n> 讲述提示：从“我”转向“很多人”；不要逐个读图表数字。\n\n后来，三十六份体验后问卷也印证了这一点：很多人同样怕项目不适合、被推销，或案例不真实。\n\n小美说要解决的，是这些共同的困扰。\n\n**脱稿关键词：** 体验后问卷 / 共同痛点 / 确认问题值得解决\n\n### P04｜对自己的审美有主见，渴望不断遇见更好的自己\n\n**01:00—01:10 · 参考10秒**\n\n> 讲述提示：像描述身边熟悉的人一样讲，不念虚构人物的姓名与履历。\n\n我们服务对自己的审美有主见，渴望不断遇见更好的自己，希望更可控、从容、安心地变美的人。\n\n**脱稿关键词：** 审美有主见 / 不断遇见更好的自己 / 可控、从容、安心\n\n### P05｜你眼中的美，看得见，说得清\n\n**01:10—01:30 · 参考20秒**\n\n> 讲述提示：先指参考照片，再移到画像；重读“可以表达、可以讨论”，让观众听懂画像的价值。\n\n具体怎么做？先选出喜欢的参考照片。\n\n小美说帮你看懂喜欢的轮廓、五官与整体风格，形成审美画像。\n\n把“我喜欢这种感觉”，变成可以表达、可以讨论的方向。\n\n**脱稿关键词：** 喜欢的参考照片 / 轮廓、五官与整体风格 / 可以表达和讨论的方向\n\n### P06｜从你的审美，到可讨论的方案\n\n**01:30—01:52 · 参考22秒**\n\n> 讲述提示：从本人特点讲到候选项目；重读“选择和调整”，不逐项念项目、用量或价格。\n\n再结合本人的照片，明确想保留和改变的特点，整理候选项目、参考用量与预算。\n\n每一步都由用户来选择和调整：把笼统的“想变美”，变成可以带去面诊讨论的方案。\n\n**脱稿关键词：** 保留与改变的特点 / 候选项目与参考预算 / 带去面诊讨论\n\n### P07｜让心里的想法，先有画面\n\n**01:52—02:12 · 参考20秒**\n\n> 讲述提示：指明左侧原照、右侧AI模拟，稍停让观众看图；重读“视觉方向”，再说明需医生确认。\n\n接着，选择想预览的项目，让心里的想法先有画面。\n\n左边是原照，右边是App生成的AI模拟，可以比较，再调整。\n\n它呈现的是可讨论的视觉方向，实际能否实现仍需医生确认。\n\n**脱稿关键词：** 让想法先有画面 / 原照与AI模拟 / 视觉方向需医生确认\n\n### P08｜带着自己的想法，从容面诊\n\n**02:12—02:30 · 参考18秒**\n\n> 讲述提示：指向面诊沟通卡；重读“自己的想法和问题”，用医生确认适合与实施收束产品体验。\n\n最后，把原照、AI模拟和所选项目整理成面诊沟通卡。\n\n面诊之前，就有自己的想法和问题，让医生更清楚地理解你的审美与期待，再由医生确认是否适合、如何实施。\n\n**脱稿关键词：** 原照＋模拟＋所选项目 / 面诊前有想法和问题 / 医生确认适合与实施\n\n### P09｜懂你的审美，也站在你这一边\n\n**02:30—02:50 · 参考20秒**\n\n> 讲述提示：从图中抬头看观众；强调“美没有标准答案”和“也可以选择暂不改变”。\n\n小美说的切入点，是消费者立场和个人审美。\n\n美没有标准答案，我们先理解你的审美，再讨论如何实现。\n\n你的反馈改变方案，每一步都由你来决定，也可以选择暂不改变。\n\n**脱稿关键词：** 消费者立场 × 个人审美 / 先理解审美，再讨论实现 / 每一步由你决定\n\n### P10｜从真实体验，到价值认可与付费意向\n\n**02:50—03:26 · 参考36秒**\n\n> 讲述提示：用“第一、第二、第三”带节奏；数字之间稍停，引用反馈后不再加例子。\n\n验证给了我们三个信号。\n\n第一，有真实体验：五十多个外部安装账号、五百多次使用会话，以及陪测、问卷和行业访谈。\n\n第二，用户觉得有用：三十六位受访者中，百分之八十六认为有助于医美决策，有人说“效果对比很直观，提的四项方案很有用”。\n\n第三，一半愿意考虑为 AI 付费；如果增加医生二次面诊，接近七成愿意考虑付费。下一步，要把意向验证成真实成交。\n\n**脱稿关键词：** 真实体验 / 86% 认可价值 / 50%／69% 付费意向\n\n### P11｜先跑通个人付费与连锁机构试点\n\n**03:26—04:05 · 参考39秒**\n\n> 讲述提示：先说当前官网免费预览，再指两条获客路径和拟议试点价格；49／20与25／10.5两组数字分开讲。\n\n当前官网免费预览，下一步通过B端和C端同时获客。C端靠小红书内容、投放和转介绍；B端从集团合作，到门店试点，再到报告续采。\n\n拟测试个人四十九元一次、机构二十元一份。\n\n按当前预算，扣除退款、税与直接成本后，单次毛利约二十五元和十点五元，尚未扣获客、团队与研发。\n\n前九十天用成交、退款、交付贡献与门店用量复盘，再决定扩大投入。\n\n**脱稿关键词：** 当前免费预览 / 两端获客，49元／20元拟测试 / 预算毛利＋90天复盘\n\n### P12｜与机构合作获取真实案例，持续迭代方案与模拟\n\n**04:05—04:18 · 参考13秒**\n\n> 讲述提示：重读“授权的真实前后案例”；这是下一步计划，不要讲成已有合作。\n\n下一步，与机构合作获取授权的真实前后案例，建立评测，迭代方案和模拟。\n\n再探索三维与可控模拟，逐步迭代任务模型。\n\n**脱稿关键词：** 授权真实案例 / 评测与迭代 / 三维与可控模拟\n\n### P13｜团队架构\n\n**04:18—04:26 · 参考8秒**\n\n> 讲述提示：顺着组织图快速点过，不在这里展开人员预算。\n\n我负责统筹；计划由 BD 推进机构合作，营销负责个人增长，研发外包按里程碑交付。\n\n**脱稿关键词：** 我来统筹 / BD＋营销 / 外包研发\n\n### P14｜融资300万元，推进首年商业验证\n\n**04:26—04:37 · 参考11秒**\n\n> 讲述提示：清楚说出“三百万元”，再说三类用途；重心落在要验证的结果。\n\n本轮申请三百万元：团队与外包研发两百万，两端市场拓展八十七万，团队 AI 额度十三万。\n\n把用户认可，推进成持续的个人付费和机构采购。\n\n**脱稿关键词：** 申请300万元 / 200＋87＋13 / 验证持续付费与采购\n\n### P15｜让你的审美，决定你的美\n\n**04:37—04:45 · 参考8秒**\n\n> 讲述提示：看向观众说“你的审美，值得被认真理解”；品牌句放慢，留一拍再致谢，停留本页等提问。\n\n你的审美，值得被认真理解。\n\n小美说，让你的审美，决定你的美。\n\n谢谢。\n\n**脱稿关键词：** 审美值得被认真理解 / 让你的审美，决定你的美 / 致谢\n\n## 问答时再翻的4页\n\n以下不计入5分钟主讲。先回应问题，再翻对应附录。\n\n### P16｜300万元逐项预算\n\n> 被问“300万怎么花”时翻到这里。 先报三个大类；只有被追问时再拆岗位、投流和BD执行费用。\n\n三百万元分成三部分：团队与外包研发两百万，C端推广六十二万、B端拓展二十五万，团队AI额度十三万。\n\n团队与研发里，项目统筹九十万、BD五十万、营销三十万、外包研发三十万。逐单交付成本仍计入经营成本，计划由订单回款支付。\n\n备查：团队AI13万不是全部用户报告的调用预算；300万不是不依赖收入的全年全部支出。\n\n### P17｜三年经营目标情景\n\n> 被问“未来收入、盈利与规模”时翻到这里。 先说这是模型情景，再回答评委问到的数字；不把预测讲成确定结果。\n\n这页是经营目标情景，依赖个人付费增长、机构门店使用和复购等假设，尚未被真实经营验证。\n\n首年净收入预计约二百六十九万元；模型里的第二年税前转正也依赖这些目标达成。我们先用前九十天验证实际成交、交付成本和持续使用，再调整扩量节奏。\n\n备查：收入与利润均为预测；月度资金峰值尚未建模。具体年度指标以页面为准。\n\n### P18｜验证事实与价格假设\n\n> 被问“付费意向是否等于有人愿意付49元”时翻到这里。 直接回答“还没有验证49元”；再讲已有证据与下一步。\n\n还没有验证四十九元的真实成交。三十六位受访者中，十八人愿意考虑为AI服务付费；愿意且填了金额的十四人里，最高愿付金额中位数约十九元，只有三人达到四十九元。\n\n所以四十九元是待测试的报价。我们会用真实支付、交付后的退款和再次购买来验证。\n\n备查：愿付金额中位数18.84元；3/14不是3/36的成交率。加医生面诊的25/36也是条件下的付费意向。\n\n### P19｜下一步用什么结果复盘\n\n> 被问“下一阶段如何证明值得继续投”时翻到这里。 回答用什么证据做决定；不临时承诺未经对齐的考核阈值。\n\n我们要验证三件事：个人是否真的付款，机构是否持续使用，以及每单能否可靠交付、留下正贡献。\n\n前九十天一起看真实成交、退款、交付成本和门店使用，再决定扩大、收窄，还是调整投入。功能完成本身不等于商业验证完成。\n\n备查：这是下一阶段验证安排，不是已批准的拨款或投资考核制度。\n\n## 上台前记准的口径\n\n| 页码 | 备查口径（不必逐条口播） |\n|---|---|\n| P03 | 36份为2026年9月9—10日完整体验后问卷；早期便利样本，不能外推全国人群。 |\n| P07 | 本页是 Build 65 App 实际生成的 AI 方案模拟，呈现可讨论的视觉方向，不是真实术后照片或疗效预测；官网可视化区为单独制作的合成人像示例，不能混作本页证据。 |\n| P10 | 9月11日核对的50+安装账号、500+使用会话；各验证样本可能重叠。31/36认可决策价值，18/36愿考虑AI付费，25/36在增加真人医生二次面诊的条件下愿考虑付费。这不是实际成交。引语来自R20、问卷Q6。 |\n| P11 | 2026年10月14日官网为免费预览，正式收费尚未开放；49元和20元均为拟议试点价格。C端净收入约43.9−直接成本19.0＝毛利24.9；B端18.5−8.0＝10.5，均为预算。B端500份起购、1万元预付；未消耗预付款不是已确认营收。毛利未扣获客、团队、研发；首年3.1万人与3集团／30门店是目标。 |\n| P12 | 真实案例合作、三维、手动微调和自有任务模型均为计划；案例用于训练、评测、展示需分别取得对应授权。 |\n| P13 | BD与营销各拟聘1人，研发采用外包；不暗示已到岗或已签约。 |\n| P14 | 融资用途200＋87＋13＝300万元。团队AI按500美元／人／月×3人×12个月，以7.2折算约13万元；逐单COGS另列经营成本，计划由订单回款支付。 |\n\n## 三遍排练\n\n1. **顺稿：**不计时，逐页讲顺；只看提示，不念提示。\n2. **计时：**连续讲完15页，以4分45秒为目标。重点检查P10验证和P11商业模式，不靠突然加速赶时间。\n3. **脱稿：**只看关键词，保留自己的说话方式；模拟一个评委追问，练习跳转到附录。\n\n关键时间点：P5开始约01:10；P10开始约02:50；P12开始约04:05；P15结束约04:45。\n\n使用说明：对照排练版左侧为当前PDF的页面快照，右侧为本稿；有计时、关键词模式、字号调节与问答附录导航。打印时自动排成独立讲稿。\n";
const $=id=>document.getElementById(id);
let index=0,mode='full',fontSize=23,running=false,accumulated=0,started=0,pageStarted=0,toastTimeout;
const time=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const elapsed=()=>accumulated+(running?(performance.now()-started)/1000:0);
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){clearTimeout(toastTimeout);$('toast').textContent=message;$('toast').hidden=false;toastTimeout=setTimeout(()=>$('toast').hidden=true,2800)}
function timerView(){const total=elapsed(),p=PAGES[index];$('elapsed').textContent=time(total);$('clock-progress').style.width=Math.min(100,total/300*100)+'%';$('clock-box').classList.toggle('over',total>300);$('timer').textContent=running?'暂停':total>0?'继续排练':'开始排练';$('timer').disabled=index>=15;$('clock-label').textContent=index>=15?'问答附录 · 主讲计时已暂停':running?(total>300?'已超过5分钟':total>=285?'进入15秒预留时间':'主讲总用时 · 计时中'):total>0?'主讲总用时 · 已暂停':'主讲总用时 · 点击开始后计时';if(p.seconds){$('timing').innerHTML=`P${String(p.page).padStart(2,'0')} · ${time(p.start)}—${time(p.end)} · 参考${p.seconds}秒<br><small>本次停留 ${time(total-pageStarted)} · 按本人语速练习，时间为参考</small>`}else{$('timing').textContent=`P${p.page} · 问答附录 · 不计入5分钟主讲`}}
function toggleTimer(){if(index>=15)return;if(running){accumulated=elapsed();running=false}else{started=performance.now();running=true}timerView()}
function render(){const p=PAGES[index];$('slide-image').src=p.image;$('slide-image').alt=`第${p.page}页：${p.title}`;$('preview-title').textContent=`${String(p.page).padStart(2,'0')} / ${p.title}`;$('title').textContent=p.title;$('spoken').innerHTML=p.script.map(s=>'<p>'+escape(s)+'</p>').join('');$('keywords').innerHTML=p.beats.map((s,n)=>`<div class="keyword"><span>0${n+1}</span><strong>${escape(s)}</strong></div>`).join('');$('cue').textContent=p.cue;$('reference-copy').textContent=p.reference;$('reference').open=false;$('page-select').value=String(index);$('page-state').textContent=index<15?`${p.page} / 15 主讲`:`${p.page-15} / 4 问答`;$('prev').disabled=index===0;$('next').disabled=index===PAGES.length-1;$('next').textContent=index===14?'问答附录 →':'下一页 →';document.querySelectorAll('.page-strip button').forEach((b,i)=>{if(i===index)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('notes-scroll').scrollTop=0;timerView();}
function go(n){if(n<0||n>=PAGES.length||n===index)return;if(n>=15&&running){accumulated=elapsed();running=false;toast('已进入问答附录，主讲计时暂停')}index=n;pageStarted=elapsed();render();try{history.replaceState(null,'','#'+PAGES[n].key)}catch{}}
function setMode(next){mode=next;$('spoken').hidden=mode!=='full';$('keywords').hidden=mode!=='key';$('keywords').style.display=mode==='key'?'flex':'none';$('full-mode').setAttribute('aria-pressed',String(mode==='full'));$('key-mode').setAttribute('aria-pressed',String(mode==='key'));$('notes-scroll').scrollTop=0}
function setFont(delta){fontSize=Math.min(34,Math.max(18,fontSize+delta));document.documentElement.style.setProperty('--script-size',fontSize+'px');$('smaller').disabled=fontSize===18;$('larger').disabled=fontSize===34}
function zoom(){const p=PAGES[index];$('large-image').src=p.image;$('lightbox-title').textContent=`P${p.page} · ${p.title}`;$('lightbox').showModal()}
const strip=$('page-strip');for(let i=0;i<PAGES.length;i++){if(i===0||i===15){const label=document.createElement('span');label.textContent=i===0?'主讲':'问答';strip.append(label)}const b=document.createElement('button');b.textContent=PAGES[i].page;b.title=PAGES[i].title;b.className=i>=15?'appendix':'';b.setAttribute('aria-label',`第${PAGES[i].page}页：${PAGES[i].title}`);b.addEventListener('click',()=>go(i));strip.append(b)}
for(const [start,end,label] of [[0,15,'5分钟主讲'],[15,19,'问答附录']]){const group=document.createElement('optgroup');group.label=label;for(let i=start;i<end;i++){const o=document.createElement('option');o.value=i;o.textContent=`${String(i+1).padStart(2,'0')} · ${PAGES[i].title}`;group.append(o)}$('page-select').append(group)}
$('page-select').onchange=e=>go(Number(e.target.value));$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('timer').onclick=toggleTimer;$('reset').onclick=()=>{accumulated=0;running=false;pageStarted=0;timerView();toast('计时已清零，当前页保留')};$('full-mode').onclick=()=>setMode('full');$('key-mode').onclick=()=>setMode('key');$('smaller').onclick=()=>setFont(-1);$('larger').onclick=()=>setFont(1);$('layout').onclick=()=>{const solo=document.body.classList.toggle('only-script');$('layout').textContent=solo?'左右对照':'只看讲稿';$('layout').setAttribute('aria-pressed',String(solo))};$('zoom').onclick=zoom;$('slide-image').onclick=zoom;$('slide-image').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();zoom()}};$('close-lightbox').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([MARKDOWN],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='小美说-DemoDay-演讲稿.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if($('lightbox').open||e.altKey||e.ctrlKey||e.metaKey)return;const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target.isContentEditable)return;if(e.key===' '&&['BUTTON','SUMMARY'].includes(tag))return;if(['ArrowLeft','ArrowRight',' ','Home','End'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')go(index-1);if(e.key==='ArrowRight')go(index+1);if(e.key===' ')toggleTimer();if(e.key==='Home')go(0);if(e.key==='End')go(14)});
function printSection(p){return `<section class="print-section ${p.page===16?'qa-start':''}"><div class="print-time">${p.seconds?time(p.start)+'—'+time(p.end)+' · 参考'+p.seconds+'秒':'问答备查 · 不计入主讲'}</div><h2>P${String(p.page).padStart(2,'0')}｜${escape(p.title)}</h2><p class="print-cue">讲述提示（不念）：${escape(p.cue)}</p>${p.script.map(s=>'<p>'+escape(s)+'</p>').join('')}<p class="print-key">脱稿关键词：${p.beats.map(escape).join(' / ')}</p></section>`}
$('print-pack').innerHTML='<div class="print-cover"><h1>小美说｜Demo Day 演讲稿</h1><p>2026.10.12 · 15页主讲，参考4分45秒，留15秒余量。提示不念；实际用时请按本人语速实测。</p></div>'+PAGES.map(printSection).join('');
const hash=decodeURIComponent(location.hash.slice(1));const initial=PAGES.findIndex(p=>p.key===hash);if(initial>=0)index=initial;setMode('full');render();setInterval(timerView,200);
</script>
</body></html>
